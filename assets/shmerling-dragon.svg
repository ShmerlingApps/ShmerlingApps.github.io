<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Shmerling</title>
  <defs>
    <linearGradient id="sd-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b8ff0"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="sd-head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe8ff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#sd-bg)"/>
  <!-- spikes along the back of the neck -->
  <path d="M21.5 33.5 13 33l7 -6z M18.5 42.5 10 43l7.5 -7z M17 51.5 8.5 53.5l8 -8z" fill="#ffc94a"/>
  <!-- horns, swept back -->
  <path d="M31.5 21.5C27.5 15.5 22.5 12 15.5 10.5c4.5 3.6 7.6 8 9.4 13.4z" fill="#ffc94a"/>
  <path d="M38.5 18.6C37 12.4 33.6 7.8 28 4.8c3.2 4.4 4.9 9.3 5.1 14.6z" fill="#ffd977"/>
  <!-- head and neck, facing right -->
  <path d="M15 64C15 48 18.5 39 24.5 33.5 23.5 24.5 30 18 39 18c7.5 0 13.5 2.6 16.6 7.7 1.9 3.2.8 7.2-3.1 8.2-4.8 1.3-9.6 1.6-13.2 3.6C35 39.7 33 47 33 64z" fill="url(#sd-head)"/>
  <!-- eye -->
  <circle cx="41" cy="25.5" r="3.6" fill="#0b1224"/>
  <circle cx="42.3" cy="24.2" r="1.25" fill="#ffffff"/>
  <!-- nostril and smile -->
  <ellipse cx="51.5" cy="25.8" rx="1.3" ry="1" fill="#6b7fb0"/>
  <path d="M44.5 31.5c2.6 1 5.4.9 8-.3" fill="none" stroke="#6b7fb0" stroke-width="1.6" stroke-linecap="round"/>
  <!-- a puff of fire -->
  <path d="M56.2 27.2c2.6-1 4.2-2.9 4.6-5.7 1.9 2.4 2.5 5.4.5 7.8-1.4 1.6-3.4 2.1-5.3 1.6.8-1 .8-2.2.2-3.7z" fill="#ff8a3d"/>
  <path d="M57.4 28.1c1.2-.6 2-1.6 2.3-3 .9 1.3 1 2.8-.1 3.9-.7.7-1.6.9-2.4.7.4-.5.4-1 .2-1.6z" fill="#ffd977"/>
  <!-- cheek -->
  <circle cx="36" cy="30.5" r="2.4" fill="#ff9fb2" opacity="0.55"/>
</svg>
